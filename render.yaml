# Render Blueprint — CrewBridge API. Secrets are sync:false: enter them in the Render dashboard, never here.
services:
  - type: web
    name: crewbridge-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w @crewbridge/server
    startCommand: npm start -w @crewbridge/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      # Browser → Vercel rewrite → Render proxy → app
      - key: TRUST_PROXY
        value: "2"
      # Skip the test-only MongoDB binary download during npm ci
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: NEXCONN_AREA
        value: SG
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
